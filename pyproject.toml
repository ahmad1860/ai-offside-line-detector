[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-offside-line-detector"
version = "0.0.1"
description = "Lightweight single-camera football offside-position estimation (CPU-first)."
# Architecture is Python-version-independent. We develop on 3.13 now; 3.11 remains supported.
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["offside"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
